syntax = "proto3";

package xray.proxy.anytls;
option csharp_namespace = "Xray.Proxy.AnyTLS";
option go_package = "github.com/xtls/xray-core/proxy/anytls";
option java_package = "com.xray.proxy.anytls";
option java_multiple_files = true;

import "common/protocol/user.proto";
import "common/protocol/server_spec.proto";

message Account { string password = 1; }
message ClientConfig {
  xray.common.protocol.ServerEndpoint server = 1;
  int64 idle_session_check_interval = 2;
  int64 idle_session_timeout = 3;
  optional uint32 min_idle_session = 4;
  bool disable_session_reuse = 5;
}
message ServerConfig { repeated xray.common.protocol.User users = 1; string padding_scheme = 2; }
