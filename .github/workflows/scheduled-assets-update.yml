name: Scheduled assets update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    paths:
      - ".github/workflows/scheduled-assets-update.yml"
      - ".github/workflows/prepare-assets.yml"
      - ".github/scripts/prepare-assets.sh"
  pull_request:
    paths:
      - ".github/workflows/scheduled-assets-update.yml"
      - ".github/workflows/prepare-assets.yml"
      - ".github/scripts/prepare-assets.sh"

jobs:
  prepare-assets:
    if: github.event.schedule == '30 22 * * *' || github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/prepare-assets.yml
    with:
      flavor: lite
      include-wintun: true
