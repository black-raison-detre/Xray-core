syntax = "proto3";

package xray.core.app.observatory.command;
option csharp_namespace = "Xray.Core.App.Observatory.Command";
option go_package = "github.com/xtls/xray-core/app/observatory/command";
option java_package = "com.xray.core.app.observatory.command";
option java_multiple_files = true;

import "app/observatory/config.proto";

message GetOutboundStatusRequest {
}

message GetOutboundStatusResponse {
  xray.core.app.observatory.ObservationResult status = 1;
}

enum CapabilityProbeKind {
  CAPABILITY_PROBE_KIND_UNSPECIFIED = 0;
  CAPABILITY_PROBE_KIND_IPV4_HTTP = 1;
  CAPABILITY_PROBE_KIND_IPV6_HTTP = 2;
  CAPABILITY_PROBE_KIND_UDP_DNS = 3;
}

enum CapabilityProbeStatus {
  CAPABILITY_PROBE_STATUS_UNSPECIFIED = 0;
  CAPABILITY_PROBE_STATUS_REACHABLE = 1;
  CAPABILITY_PROBE_STATUS_FAILED = 2;
  CAPABILITY_PROBE_STATUS_UNAVAILABLE = 3;
}

message TestOutboundCapabilitiesRequest {
  string outbound_tag = 1;
  repeated CapabilityProbeKind kinds = 2;
  string http_url = 3;
  string udp_query_domain = 4;
  string udp_dns_server = 5;
  uint32 timeout_milliseconds = 6;
}

message CapabilityProbeResult {
  CapabilityProbeKind kind = 1;
  CapabilityProbeStatus status = 2;
  int64 latency_milliseconds = 3;
  int64 resolution_time_milliseconds = 4;
  string address = 5;
  uint32 http_status = 6;
  uint32 dns_rcode = 7;
  uint32 dns_answer_count = 8;
  string failure_stage = 9;
  string error = 10;
}

message TestOutboundCapabilitiesResponse {
  repeated CapabilityProbeResult results = 1;
}

enum ResolverProbeTransport {
  RESOLVER_PROBE_TRANSPORT_UNSPECIFIED = 0;
  RESOLVER_PROBE_TRANSPORT_UDP = 1;
  RESOLVER_PROBE_TRANSPORT_TCP = 2;
  RESOLVER_PROBE_TRANSPORT_HTTPS = 3;
  RESOLVER_PROBE_TRANSPORT_H2C = 4;
}

enum ResolverProbeQueryType {
  RESOLVER_PROBE_QUERY_TYPE_UNSPECIFIED = 0;
  RESOLVER_PROBE_QUERY_TYPE_A = 1;
  RESOLVER_PROBE_QUERY_TYPE_AAAA = 2;
}

enum ResolverProbeStatus {
  RESOLVER_PROBE_STATUS_UNSPECIFIED = 0;
  RESOLVER_PROBE_STATUS_REACHABLE = 1;
  RESOLVER_PROBE_STATUS_FAILED = 2;
}

message TestResolverReachabilityRequest {
  string outbound_tag = 1;
  ResolverProbeTransport transport = 2;
  string host = 3;
  uint32 port = 4;
  string path = 5;
  string query_name = 6;
  ResolverProbeQueryType query_type = 7;
  uint32 timeout_milliseconds = 8;
}

message ResolverProbeResult {
  ResolverProbeStatus status = 1;
  bool transport_reachable = 2;
  bool protocol_valid = 3;
  int64 latency_milliseconds = 4;
  string address = 5;
  uint32 http_status = 6;
  uint32 dns_rcode = 7;
  uint32 dns_answer_count = 8;
  repeated string answers = 9;
  bool truncated = 10;
  string failure_stage = 11;
  string error = 12;
}

message TestResolverReachabilityResponse {
  ResolverProbeResult result = 1;
}

service ObservatoryService {
  rpc GetOutboundStatus(GetOutboundStatusRequest)
      returns (GetOutboundStatusResponse) {}
  rpc TestOutboundCapabilities(TestOutboundCapabilitiesRequest)
      returns (TestOutboundCapabilitiesResponse) {}
  rpc TestResolverReachability(TestResolverReachabilityRequest)
      returns (TestResolverReachabilityResponse) {}
}


message Config {}
